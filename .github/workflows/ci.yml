name: CI Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run AGENTS.md quality & coverage gate
        run: ./scripts/check-gate.sh
      - name: Run benchmarks (smoke performance check)
        run: go test -bench=. -benchtime=100ms ./internal/redact ./internal/router

